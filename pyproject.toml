[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control"
version = "0.1.0"
description = "Typed foundations for a real-time hand gesture control pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.11,<5", "mediapipe>=0.10.32,<0.11", "numpy>=2,<3"]
ui = ["opencv-contrib-python>=4.11,<5", "numpy>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gesture_control = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
